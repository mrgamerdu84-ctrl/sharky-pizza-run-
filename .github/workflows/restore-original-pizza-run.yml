# Copie bit pour bit du jeu original — ne modifie pas La Jungle de l'Arcade.
name: Restore original Sharky Pizza Run

on:
  push:
    paths:
      - '.github/workflows/restore-original-pizza-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout original game commit (read-only)
        uses: actions/checkout@v4
        with:
          repository: mrgamerdu84-ctrl/la-jungle-de-l-arcade
          ref: b6cf16f772c8689433f124162ef7626224ef7798
          token: ${{ github.token }}
          path: source

      - name: Copy original Sharky Pizza Run files unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/src/games target/src/routes target/src/assets
          cp source/src/games/SharkyPizzaRun.tsx target/src/games/SharkyPizzaRun.tsx
          cp source/src/routes/games.pizza-run.tsx target/src/routes/games.pizza-run.tsx
          cp source/src/assets/sharky-scooter.png target/src/assets/sharky-scooter.png
          cp source/src/assets/pizza-box.png target/src/assets/pizza-box.png

          test "$(git -C source hash-object src/games/SharkyPizzaRun.tsx)" = "$(git -C target hash-object src/games/SharkyPizzaRun.tsx)"
          test "$(git -C source hash-object src/assets/sharky-scooter.png)" = "$(git -C target hash-object src/assets/sharky-scooter.png)"
          test "$(git -C source hash-object src/assets/pizza-box.png)" = "$(git -C target hash-object src/assets/pizza-box.png)"

      - name: Commit exact original files
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/SharkyPizzaRun.tsx src/routes/games.pizza-run.tsx src/assets/sharky-scooter.png src/assets/pizza-box.png
          if git diff --cached --quiet; then
            echo "Original files already present."
            exit 0
          fi
          git commit -m "restore: copy original Sharky Pizza Run unchanged"
          git push
